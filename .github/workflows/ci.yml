name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          JWT_SECRET: test-jwt-secret-for-ci
          SUPABASE_URL: ''
          SUPABASE_SERVICE_ROLE_KEY: placeholder-key
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_NAME: test_db
          NODE_ENV: test

      - name: Run unit tests
        run: npm run test
        env:
          JWT_SECRET: test-jwt-secret-for-ci
          SUPABASE_URL: ''
          SUPABASE_SERVICE_ROLE_KEY: placeholder-key
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_NAME: test_db
          NODE_ENV: test

      - name: Run lint
        run: npm run lint

      - name: Security audit
        run: npm audit --audit-level=high || true
