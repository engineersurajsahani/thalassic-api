name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Create PostgreSQL root role
        run: |
          docker exec $(docker ps -q --filter ancestor=postgres:15) psql -U postgres -c "CREATE USER root WITH SUPERUSER PASSWORD 'postgres';" || true
          docker exec $(docker ps -q --filter ancestor=postgres:15) psql -U postgres -c "CREATE DATABASE root OWNER root;" || true
          docker exec $(docker ps -q --filter ancestor=postgres:15) psql -U postgres -c "GRANT ALL PRIVILEGES ON DATABASE test_db TO root;" || true

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          JWT_SECRET: test-jwt-secret-for-ci
          SUPABASE_URL: ''
          SUPABASE_SERVICE_ROLE_KEY: placeholder-key
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_NAME: test_db
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: test_db
          USER: postgres
          USERNAME: postgres
          NODE_ENV: test

      - name: Run unit tests
        run: npm run test
        env:
          JWT_SECRET: test-jwt-secret-for-ci
          SUPABASE_URL: ''
          SUPABASE_SERVICE_ROLE_KEY: placeholder-key
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_NAME: test_db
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: test_db
          USER: postgres
          USERNAME: postgres
          NODE_ENV: test

      - name: Run lint
        run: npm run lint || true

      - name: Security audit
        run: npm audit --audit-level=high || true
